name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the version used for local development.
  FLUTTER_VERSION: 3.47.8

jobs:
  analyze:
    name: Format, analyze, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  linux:
    name: Linux build + end-to-end tests
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libasound2-dev \
            xvfb mesa-utils
      - run: flutter pub get
      - name: Build release bundle
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: cru-media-player-linux-x64
          path: build/linux/x64/release/bundle
      - name: End-to-end tests (real playback under a virtual display)
        env:
          # Software OpenGL: CI runners have no GPU.
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          status=0
          for f in integration_test/*_test.dart; do
            echo "::group::$f"
            python3 tool/ci_test.py "linux $f" \
              xvfb-run -a -s "-screen 0 1920x1080x24" \
              flutter test "$f" -d linux \
              --dart-define=FIXTURES="$PWD/integration_test/fixtures" \
              --dart-define=NO_GPU=true || status=1
            echo "::endgroup::"
          done
          exit $status

  windows:
    name: Windows build + end-to-end tests
    needs: analyze
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build release
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: cru-media-player-windows-x64
          path: build/windows/x64/runner/Release
      - name: End-to-end tests (real playback)
        shell: pwsh
        run: |
          $status = 0
          foreach ($f in Get-ChildItem integration_test -Filter *_test.dart) {
            Write-Output "::group::$($f.Name)"
            python tool/ci_test.py "windows $($f.Name)" `
              flutter test "integration_test/$($f.Name)" -d windows `
              --dart-define=FIXTURES="$env:GITHUB_WORKSPACE\integration_test\fixtures"
            if ($LASTEXITCODE -ne 0) { $status = 1 }
            Write-Output "::endgroup::"
          }
          exit $status
